<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/>
    </marker>
    <style>
      .title { font-size: 21px; font-weight: 700; fill: #0b0b0b; }
      .sub   { font-size: 12.5px; fill: #898781; }
      .h     { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
      .d     { font-size: 12px; fill: #52514e; }
      .lbl   { font-size: 11.5px; fill: #52514e; }
      .foot  { font-size: 12px; fill: #52514e; font-style: italic; }
      .box   { fill: #ffffff; stroke: #e1e0d9; stroke-width: 1.2; }
      .core  { fill: #eaf2fc; stroke: #cfe0f7; stroke-width: 1.2; }
      .band  { fill: #f2f6fc; stroke: #cfe0f7; stroke-width: 1.2; }
      .accent{ fill: #2a78d6; }
      .accentc{ fill: #184f95; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="660" rx="10" fill="#fcfcfb"/>

  <text x="34" y="42" class="title">Deterministic simulation — one seed, one thread, virtual time</text>
  <text x="34" y="64" class="sub">the same sans-IO raft core as production, driven entirely by a seeded schedule</text>

  <!-- Seed / PRNG -->
  <rect class="box" x="30" y="84" width="360" height="56" rx="10"/>
  <rect class="accent" x="30" y="94" width="6" height="36" rx="3"/>
  <text x="52" y="108" class="h">Seed <tspan font-style="italic">s</tspan> → PRNG</text>
  <text x="52" y="128" class="d">the single source of every random choice</text>
  <line x1="210" y1="140" x2="210" y2="168" stroke="#898781" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Event queue -->
  <rect class="box" x="30" y="168" width="740" height="80" rx="10"/>
  <rect class="accent" x="30" y="178" width="6" height="60" rx="3"/>
  <text x="52" y="200" class="h">Virtual-time event queue</text>
  <text x="52" y="222" class="d">client requests · node tick timers · in-flight messages</text>
  <text x="52" y="240" class="d">ordered by virtual time — popping the next event advances the clock</text>
  <line x1="400" y1="248" x2="400" y2="276" stroke="#898781" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="412" y="266" class="lbl">pop next event</text>

  <!-- Nodes: sans-IO raft core -->
  <rect class="core" x="30" y="276" width="740" height="80" rx="10"/>
  <rect class="accentc" x="30" y="286" width="6" height="60" rx="3"/>
  <text x="52" y="298" class="h">Nodes — sans-IO raft core</text>
  <text x="52" y="320" class="d">no sockets, clocks, or threads — byte-for-byte the kvd binary's logic</text>
  <text x="52" y="338" class="d">steps the state machine; emits durable-state writes, then messages</text>
  <line x1="400" y1="356" x2="400" y2="384" stroke="#898781" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="412" y="374" class="lbl">outputs: persist before send</text>

  <!-- Simulated network + disks -->
  <rect class="box" x="30" y="384" width="740" height="92" rx="10"/>
  <rect class="accent" x="30" y="394" width="6" height="72" rx="3"/>
  <text x="52" y="406" class="h">Simulated network &amp; disks</text>
  <text x="52" y="428" class="d">drop · duplicate · reorder · symmetric / asymmetric partition</text>
  <text x="52" y="446" class="d">crash &amp; restart (volatile state lost, durable state kept) · compaction pressure</text>
  <text x="52" y="464" class="d">surviving messages and fault timers become new future events</text>

  <!-- loopback arrow -->
  <path d="M 770,430 H 852 V 208 H 774" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="874" y="319" class="lbl" text-anchor="middle" transform="rotate(90 874 319)">enqueue as future events</text>

  <!-- invariant band -->
  <rect class="band" x="30" y="496" width="740" height="46" rx="10"/>
  <circle cx="58" cy="519" r="7" fill="#0ca30c"/>
  <path d="M54.5,519 l2.5,2.5 l4.5,-5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="515" class="h" font-size="13">Checked every step</text>
  <text x="78" y="532" class="d">≤ 1 leader per term · state-machine safety (same entry at same index everywhere) · log matching</text>

  <!-- WGL band -->
  <rect class="band" x="30" y="554" width="740" height="46" rx="10"/>
  <circle cx="58" cy="577" r="7" fill="#2a78d6"/>
  <path d="M54.5,577 l2.5,2.5 l4.5,-5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="573" class="h" font-size="13">End of run</text>
  <text x="78" y="590" class="d">Wing &amp; Gong linearizability check over the whole client history · full-cluster convergence</text>

  <text x="34" y="632" class="foot">A run is a pure function of its seed. A failure prints the seed; --start &lt;seed&gt; replays the bug bit-for-bit.</text>
</svg>
